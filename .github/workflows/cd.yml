name: CD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ai4i-predictive-maintenance

jobs:
  docker-release:
    name: Build, smoke test and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: image
        shell: bash
        run: |
          echo "sha_tag=${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "release_tag=${IMAGE_NAME}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.image.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        shell: bash
        run: |
          docker run --detach --name ai4i-cd-smoke --publish 18000:8000 "${{ steps.image.outputs.sha_tag }}"
          trap 'docker logs ai4i-cd-smoke || true; docker rm -f ai4i-cd-smoke || true' EXIT
          for attempt in {1..30}; do
            live_ok=false
            ready_ok=false
            if curl --fail --silent http://127.0.0.1:18000/health/live > /dev/null; then
              live_ok=true
            fi
            if curl --fail --silent http://127.0.0.1:18000/health/ready | grep -q '"status":"ok"'; then
              ready_ok=true
            fi
            if [[ "${live_ok}" == true && "${ready_ok}" == true ]]; then
              echo "Container liveness and release readiness checks passed."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy in time."
          exit 1

      - name: Login to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        if: steps.image.outputs.publish == 'true'
        shell: bash
        run: |
          docker tag "${{ steps.image.outputs.sha_tag }}" "${{ steps.image.outputs.release_tag }}"
          docker tag "${{ steps.image.outputs.sha_tag }}" "${IMAGE_NAME}:latest"
          docker push "${{ steps.image.outputs.release_tag }}"
          docker push "${IMAGE_NAME}:latest"
