name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "ruff==0.9.7"

      - name: Verify model runtime version
        run: python -c "import sklearn; assert sklearn.__version__ == '1.7.1', sklearn.__version__; print(sklearn.__version__)"

      - name: Validate tracked AI4I dataset
        run: |
          python -c "from pathlib import Path; p=Path('data/raw/ai4i2020.csv'); assert p.is_file() and p.stat().st_size > 0, p; print(f'{p}: {p.stat().st_size} bytes')"

      - name: Lint
        run: python -m ruff check --no-cache src app.py tests scripts

      - name: Format check
        run: python -m ruff format --check --no-cache src app.py tests scripts

      - name: Test
        run: python -m pytest -q
