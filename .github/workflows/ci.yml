name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.9.7"

      - name: Ruff check
        run: python -m ruff check --no-cache src app.py tests scripts

      - name: Ruff format check
        run: python -m ruff format --check --no-cache src app.py tests scripts

  tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify scikit-learn version
        run: |
          python -c "import sklearn; assert sklearn.__version__ == '1.7.1', sklearn.__version__; print(sklearn.__version__)"

      - name: Verify AI4I dataset
        run: |
          python -c "from pathlib import Path; p=Path('data/raw/ai4i2020.csv'); assert p.is_file() and p.stat().st_size > 0, p; print(f'{p}: {p.stat().st_size} bytes')"

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai4i-risk-triage:ci .

      - name: Start container
        run: |
          docker run -d \
            --name ai4i-risk-triage-ci \
            -p 8000:8000 \
            ai4i-risk-triage:ci

      - name: Wait for model readiness
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs ai4i-risk-triage-ci
          exit 1

      - name: Smoke test liveness
        run: curl --fail --silent http://127.0.0.1:8000/live

      - name: Smoke test scoring
        run: |
          curl --fail --silent --show-error \
            -X POST \
            http://127.0.0.1:8000/score \
            -H "Content-Type: application/json" \
            -d '{
              "record_id": "ci_sample",
              "product_quality_type": "M",
              "air_temperature_k": 300.0,
              "process_temperature_k": 310.0,
              "rotational_speed_rpm": 1500.0,
              "torque_nm": 40.0,
              "tool_wear_min": 120.0
            }'

      - name: Container logs on failure
        if: failure()
        run: docker logs ai4i-risk-triage-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f ai4i-risk-triage-ci || true
