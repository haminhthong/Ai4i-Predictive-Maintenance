# Configuration for Decision Policy Engine
decision_policy:
  version: "maintenance-policy-v2"
  cost_matrix:
    false_negative_weight: 5.0
    false_positive_weight: 1.0
    unit: "relative_cost_units"

  capacity_constraints:
    scenarios:
      - name: "unconstrained"
        max_alert_rate: null
      - name: "max_5pct_alerts"
        max_alert_rate: 0.05
      - name: "max_3pct_alerts"
        max_alert_rate: 0.03
      - name: "max_2pct_alerts"
        max_alert_rate: 0.02

  action_mapping:
    actions:
      - "NO_ALERT"
      - "REVIEW_REQUIRED"
      - "PRIORITY_REVIEW"
    critical_escalation_precision: 0.90

  reliability_gate:
    guardrail_percentiles:
      lower: 0.005 # P0.5
      upper: 0.995 # P99.5
    action_on_warning: "REVIEW_REQUIRED"
